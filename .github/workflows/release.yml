name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --timeout 60000

      - name: Write App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Without signing secrets the build is unsigned; release-mac.sh rejects a partial set.
          [ -n "$APPLE_API_KEY_P8" ] || exit 0
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$key")
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          # electron-builder puts its temporary signing keychain here, so cleanup can find it.
          mkdir -p "$RUNNER_TEMP/app-builder"
          echo "APP_BUILDER_TMP_DIR=$RUNNER_TEMP/app-builder" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # Fails if the tag does not match the package.json version.
        run: scripts/release-mac.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="dist/BetterGit-${GITHUB_REF_NAME#v}-arm64.dmg"
          notes=()
          if codesign -dv dist/mac-arm64/BetterGit.app 2>&1 | grep -qx 'Signature=adhoc'; then
            notes=(--notes "**Unsigned build.** Apple has not notarized this app, so macOS blocks it the first time you open it.

          1. Move BetterGit to Applications and try to open it.
          2. Open System Settings > Privacy & Security. Under Security, click **Open Anyway** and enter your login password. The button appears for about an hour after the blocked attempt.

          Or clear the quarantine flag in Terminal: \`xattr -dr com.apple.quarantine /Applications/BetterGit.app\`")
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" --verify-tag --generate-notes "${notes[@]}"
          fi

      - name: Remove key material
        if: always()
        run: |
          for keychain in "$RUNNER_TEMP"/app-builder/*.keychain; do
            [ -e "$keychain" ] && security delete-keychain "$keychain"
          done
          rm -rf "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app-builder"
